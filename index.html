<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday!</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    height: 100vh;
    background: #e9e6dc;
    font-family: "Courier New", monospace;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

/* Popup Windows */
.window {
    width: 340px;
    background: #c0c0c0;
    border: 3px solid #555;
    box-shadow: 7px 7px 0 #777;
    padding: 5px;
    position: absolute;
    z-index: 2;
}

.title-bar {
    background: #000080;
    color: white;
    padding: 7px;
    font-weight: bold;
    display: flex;
    justify-content: space-between;
}

.close {
    background: #c0c0c0;
    color: black;
    padding: 0 5px;
}

.content {
    padding: 25px 10px;
    text-align: center;
}

.cake {
    font-size: 65px;
    margin-bottom: 15px;
    animation: bounce 1s infinite alternate;
}

@keyframes bounce {
    from { transform: translateY(0); }
    to { transform: translateY(-10px); }
}

.message {
    font-size: 13px;
    margin-bottom: 20px;
    line-height: 1.7;
}

.buttons {
    display: flex;
    justify-content: center;
    gap: 15px;
}

button {
    background: #c0c0c0;
    border: 2px solid;
    border-color: white #555 #555 white;
    padding: 8px 22px;
    font-family: inherit;
    cursor: pointer;
}

button:active {
    border-color: #555 white white #555;
}

/* Birthday Screen */
#birthday {
    display: none;
    text-align: center;
    position: relative;
    z-index: 5;
    padding: 20px;
}

#birthday h1 {
    color: #a05272;
    font-size: 36px;
    margin-bottom: 20px;
}

#birthday p {
    color: #55444b;
    line-height: 1.8;
    font-size: 16px;
}

.big-cake {
    font-size: 100px;
    margin: 20px;
}

.heart {
    font-size: 30px;
    margin-top: 20px;
    animation: pulse 1s infinite alternate;
}

@keyframes pulse {
    to { transform: scale(1.3); }
}

/* Confetti */
.confetti {
    position: absolute;
    top: -20px;
    width: 10px;
    height: 10px;
    animation: fall 4s linear forwards;
    z-index: 10;
}

@keyframes fall {
    to {
        transform: translateY(110vh) rotate(720deg);
    }
}

@media(max-width: 400px) {
    .window { width: 90%; }
    #birthday h1 { font-size: 28px; }
}
</style>
</head>

<body>

<!-- POPUP AWAL -->
<div class="window" id="popup">

    <div class="title-bar">
        <span>Birthday.exe</span>
        <span class="close">X</span>
    </div>

    <div class="content">

        <div class="cake">🎂</div>

        <div class="message">
            OOOOPS ERROR!<br>
            Another year has arrived!<br>
            Please celebrate it!
        </div>

        <div class="buttons">
            <button onclick="startBirthday()">Start</button>
            <button onclick="ignore()">Ignore</button>
        </div>

    </div>
</div>

<!-- HALAMAN ULANG TAHUN -->
<div id="birthday">

    <h1>Happy Birthday!</h1>

    <div class="big-cake">🎂</div>

    <p>
        Dear <b id="name">My Special Person</b> 💗
        <br><br>
        Wishing you a beautiful day<br>
        filled with happiness and love.
        <br><br>
        May all your dreams come true.<br>
        Keep shining and smiling!
        <br><br>
        You deserve all the happiness
        in this world.
    </p>

    <div class="heart">💗✨💗</div>

</div>

<script>

// Ganti nama di sini
const birthdayName = "Nadiya";

document.getElementById("name").innerText = birthdayName;

// Tombol Start
function startBirthday() {

    document.getElementById("popup").style.display = "none";

    document.getElementById("birthday").style.display = "block";

    createConfetti();
}

// Tombol Ignore
function ignore() {

    document.querySelector(".message").innerHTML =
    "HEY! Don't ignore this birthday! 🎂<br>Click START please!";

}

// Membuat confetti
function createConfetti() {

    const colors = [
        "#ff8fab",
        "#ffd166",
        "#a0c4ff",
        "#caffbf",
        "#bdb2ff"
    ];

    for (let i = 0; i < 100; i++) {

        const confetti = document.createElement("div");

        confetti.classList.add("confetti");

        confetti.style.left = Math.random() * 100 + "vw";

        confetti.style.backgroundColor =
        colors[Math.floor(Math.random() * colors.length)];

        confetti.style.animationDelay =
        Math.random() * 3 + "s";

        confetti.style.borderRadius =
        Math.random() > 0.5 ? "50%" : "0";

        document.body.appendChild(confetti);

        setTimeout(() => {
            confetti.remove();
        }, 7000);
    }
}

</script>

</body>
</html>
